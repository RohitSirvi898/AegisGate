services:
  aegis-cache:
    image: redis:7.2-alpine
    container_name: aegis_cache
    restart: always
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aegis_mesh

  aegis-queue:
    image: rabbitmq:3.12-management-alpine
    container_name: aegis_queue
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aegis_mesh

  aegis-db:
    image: mongo:7.0
    container_name: aegis_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: aegis_admin
      MONGO_INITDB_ROOT_PASSWORD: aegis_secure_password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aegis_mesh

  ai-anomaly-engine:
    build:
      context: ./services/ai-anomaly-engine
      dockerfile: Dockerfile
    container_name: ai_anomaly_engine
    restart: always
    ports:
      - "8000:8000"
    networks:
      - aegis_mesh

  gateway-core:
    build:
      context: ./services/gateway-core
      dockerfile: Dockerfile
    container_name: gateway_core
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_ANOMALY_ENGINE_URL=http://ai_anomaly_engine:8000/analyze
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://aegis_cache:6379
      - RABBITMQ_URL=amqp://aegis_queue:5672
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      aegis-cache:
        condition: service_healthy
      ai-anomaly-engine:
        condition: service_started
      aegis-queue:
        condition: service_healthy
      aegis-db:
        condition: service_healthy
    networks:
      - aegis_mesh

  async-audit-worker:
    build:
      context: ./services/async-audit-worker
      dockerfile: Dockerfile
    container_name: async_audit_worker
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI}
      - RABBITMQ_URL=amqp://aegis_queue:5672
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      aegis-queue:
        condition: service_healthy
      aegis-db:
        condition: service_healthy
    networks:
      - aegis_mesh

  admin-dashboard:
    build:
      context: ./services/admin-dashboard
      dockerfile: Dockerfile
    container_name: admin_dashboard
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - gateway-core
    networks:
      - aegis_mesh

networks:
  aegis_mesh:
    driver: bridge
